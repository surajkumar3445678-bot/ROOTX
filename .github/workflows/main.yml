name: Build ROOT X APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate Flutter project (handles uploaded ZIP and nested folders)
        shell: bash
        run: |
          set -e
          PUB=$(find . -name pubspec.yaml -not -path '*/.*/*' -not -path '*/build/*' | head -n 1 || true)
          if [ -z "$PUB" ]; then
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1 || true)
            if [ -n "$ZIP" ]; then
              echo "No pubspec.yaml found, extracting $ZIP"
              mkdir -p _unzipped
              unzip -q -o "$ZIP" -d _unzipped
              PUB=$(find _unzipped -name pubspec.yaml -not -path '*/build/*' | head -n 1 || true)
            fi
          fi
          if [ -z "$PUB" ]; then
            echo "::error::pubspec.yaml not found in repository or in any ZIP"
            exit 1
          fi
          DIR=$(dirname "$PUB")
          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter and Android toolchain info
        shell: bash
        run: |
          flutter --version
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          flutter doctor -v || true

      - name: Ensure Android scaffold (adds missing Gradle files, keeps ours)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')
          flutter create --platforms=android --org com.rootx --project-name "$NAME" "$RUNNER_TEMP/scaffold"
          mkdir -p android
          cp -rn "$RUNNER_TEMP/scaffold/android/." android/
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle* || true
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Pre-download Gradle (mirrors + retries)
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          PROP=android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl "$PROP"
          V=$(grep distributionUrl "$PROP" | sed -E 's/.*gradle-([0-9.]+)-(all|bin)\.zip.*/\1/')
          echo "Gradle version: $V"
          OUT="$RUNNER_TEMP/gradle-$V-bin.zip"
          URLS="
          https://services.gradle.org/distributions/gradle-$V-bin.zip
          https://downloads.gradle.org/distributions/gradle-$V-bin.zip
          https://mirrors.cloud.tencent.com/gradle/gradle-$V-bin.zip
          https://mirrors.huaweicloud.com/gradle/gradle-$V-bin.zip
          "
          OK=0
          for round in 1 2 3; do
            for u in $URLS; do
              echo "Trying $u"
              rm -f "$OUT"
              if curl -fL --retry 2 --connect-timeout 20 --max-time 300 -o "$OUT" "$u" && unzip -tq "$OUT" > /dev/null 2>&1; then
                OK=1
                break 2
              fi
            done
            echo "Round $round failed, waiting 20s..."
            sleep 20
          done
          if [ "$OK" = "1" ]; then
            sed -i '/^distributionUrl=/d' "$PROP"
            echo "distributionUrl=file\\://$OUT" >> "$PROP"
            echo "Using local Gradle:"
            grep distributionUrl "$PROP"
          else
            echo "::warning::Could not pre-download Gradle, using the default wrapper download"
          fi

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for i in 1 2 3; do
            flutter pub get && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Analyze
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Test
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test 2>&1 | tee test.log

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for i in 1 2 3; do
            flutter build apk --debug 2>&1 | tee build_debug.log && exit 0
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for i in 1 2 3; do
            flutter build apk --release 2>&1 | tee build_release.log && exit 0
            echo "Attempt $i failed, retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ROOT-X-APKs
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ env.PROJECT_DIR }}/*.log
          if-no-files-found: ignore
